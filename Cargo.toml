[workspace]
members = [
    "proc_macros",
]

[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
proc_macros = { path = "./proc_macros" }
blp = "0.1.37"
#blp = { path = "../blp-rs" }
bson = { version = "3.1.0", features = ["chrono-0_4", "serde_with-3"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
image = "0.25.10"
mongodb = { version = "3.5.1", features = ["bson-3"] }
#rembg-rs = "0.1.3"
rembg-rs = { path = "../rembg-rs" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "multipart"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.17.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }
zip = "8.2.0"
once_cell = "1.21.3"
dashmap = "7.0.0-rc2"
async-trait = "0.1.89"
bytes = "1.11.1"